# Render Blueprint: New → Blueprint → pick this repository.
#
# Free plan: no persistent disk, so saved connections are lost whenever the service
# restarts, redeploys or sleeps (after ~15 idle minutes). To keep them, switch to
# `plan: starter` and add:
#     disk:
#       name: jarvis-data
#       mountPath: /data
#       sizeGB: 1
services:
  - type: web
    name: jarvis
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JARVIS_AUTH_USERNAME
        value: admin
      # You are asked for this when the Blueprint is created. Minimum 8 characters.
      - key: JARVIS_AUTH_PASSWORD
        sync: false
      # 32-byte key that encrypts stored connection passwords. Generate one with
      #   openssl rand -base64 32
      # and keep it stable.
      - key: JARVIS_SECRET_KEY
        sync: false
      # Render terminates TLS in front of the container.
      - key: JARVIS_TRUST_PROXY
        value: '1'
      # The onrender.com URL is detected automatically (RENDER_EXTERNAL_URL). Add a custom
      # domain here if you attach one, e.g. https://jarvis.example.com
      # - key: JARVIS_PUBLIC_ORIGIN
      #   value: https://jarvis.example.com
